name: AFXC Compiler Engine CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build & Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Static Code Analysis & Syntax Check
        run: node afxc-v8.js check

      - name: Execute Unit & Integration Test Suite
        run: npm test

      - name: Build Project & Generate CMS Manifests + Bundles
        run: node afxc-v8.js build

      - name: Upload Build Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: afxc-dist-node-${{ matrix.node-version }}
          path: dist/
          retention-days: 7
